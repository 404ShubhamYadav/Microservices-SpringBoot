spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

server.port=8080


# =========================
# BOOK SERVICE ROUTE
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=book-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/book/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# =========================
# STUDENT SERVICE ROUTE
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/student/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
